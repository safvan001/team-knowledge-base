{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Team Knowledge Base{% endblock %}</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
      --accent: #1f5fa9; --panel: #f7f8fa; --path: #4b5563;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --fg: #e8eaed; --muted: #9aa2af; --line: #2a2e35;
        --accent: #7aa9e6; --panel: #1b1e24; --path: #a7b0bd;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 60px; }
    header { border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    header .wrap { padding-bottom: 14px; padding-top: 18px; }
    nav a { color: var(--muted); text-decoration: none; margin-right: 16px; font-size: 14px; }
    nav a:hover, nav a.on { color: var(--accent); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 26px 0 10px; text-transform: uppercase;
         letter-spacing: .06em; color: var(--muted); font-weight: 600; }
    h3 { font-size: 15px; margin: 18px 0 6px; }
    a { color: var(--accent); }
    .sub { color: var(--muted); font-size: 14px; margin: 0; }
    form.ask { display: flex; gap: 8px; margin: 18px 0 6px; }
    form.ask input[type=text] {
      flex: 1; padding: 10px 12px; font-size: 15px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    }
    form.ask button {
      padding: 10px 18px; font-size: 15px; border: 0; border-radius: 6px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .examples { font-size: 13px; color: var(--muted); }
    .examples a { display: block; margin: 4px 0; }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px; padding: 16px 18px; margin: 12px 0;
    }
    .answer { white-space: pre-wrap; }
    .tag {
      display: inline-block; font-size: 11px; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line);
      border-radius: 4px; padding: 1px 6px; margin-right: 6px;
    }
    ul.plain { list-style: none; padding: 0; margin: 0; }
    ul.plain li { padding: 7px 0; border-bottom: 1px solid var(--line); }
    ul.plain li:last-child { border-bottom: 0; }
    .path {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 12.5px; color: var(--path); margin-top: 3px;
      overflow-x: auto; white-space: nowrap; padding-bottom: 2px;
    }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    td { padding: 5px 10px 5px 0; vertical-align: top; }
    td.k { color: var(--muted); white-space: nowrap; width: 1%; }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Team Knowledge Base</h1>
      <nav>
        <a href="{% url 'ask' %}" class="{% block nav_ask %}{% endblock %}">Ask</a>
        <a href="{% url 'browse' %}" class="{% block nav_browse %}{% endblock %}">Browse</a>
        <a href="/api/">API</a>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
